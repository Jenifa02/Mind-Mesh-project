[project]
name = "backend"
version = "0.1.0"
description = "MindMesh"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"




